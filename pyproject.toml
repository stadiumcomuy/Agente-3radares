[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radares"
version = "0.1.0"
description = "Agente de tres radares: detecta grietas accionables para un e-commerce de calzado en Uruguay."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.4.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radares = "radares.cli:main"

[tool.setuptools.packages.find]
include = ["radares*"]
